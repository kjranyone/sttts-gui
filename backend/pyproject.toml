[project]
name = "sttts-server"
version = "0.1.0"
description = "sttts-gui backend: streaming ASR -> chunking -> Irodori-TTS (Intel XPU)"
requires-python = ">=3.12"
dependencies = [
    "irodori-tts[xpu] @ git+https://github.com/Aratako/Irodori-TTS",
    "faster-whisper>=1.1.0",
    "silero-vad[onnx-cpu]>=6",
    "sounddevice>=0.5.1",
    "soxr>=0.5.0.post1",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Intel Arc (XPU) 用。本家 Irodori-TTS の pyproject をミラー。
# モデル推論はこの extra 付きで同期すること: uv sync --extra xpu
xpu = [
    "torch>=2.10.0,<2.11.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchao>=0.16.0,<0.17.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchaudio>=2.10.0,<2.11.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchcodec>=0.10.0,<0.11.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "triton-xpu==3.6.0; sys_platform == 'linux' or sys_platform == 'win32'",
]

[tool.uv]
# sentencepiece 0.1.x(irodori-tts のピン "<0.2")は cp312 Windows wheel が存在せず、
# sdist ビルドが現行 CMake(3.5 未満互換削除)で必ず失敗するため 0.2.x へ上書きする。
override-dependencies = ["sentencepiece>=0.2.0,<0.3"]

[tool.uv.sources]
torch = [
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
triton-xpu = [
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sttts_server"]

[tool.hatch.metadata]
# irodori-tts @ git+... の direct reference を依存に持つために必要
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
