[project]
name = "sttts-server"
version = "0.1.0"
description = "sttts-gui backend: streaming ASR -> chunking -> Irodori-TTS (Intel XPU / NVIDIA CUDA / CPU)"
requires-python = ">=3.12"
dependencies = [
    # PyTorch バックエンドは下の extra(xpu / cu128 / cpu)のどれか1つで選ぶ。
    # irodori-tts は検証済みコミットに固定(uv.lock と同じ 89f9d8f)。
    "irodori-tts @ git+https://github.com/Aratako/Irodori-TTS@89f9d8fbd4d51ea019867ee1197725ede1df13c5",
    "faster-whisper>=1.1.0",
    "silero-vad[onnx-cpu]>=6",
    "sounddevice>=0.5.1",
    "soxr>=0.5.0.post1",
    "numpy>=1.26",
    # GUI の「認識」ドロップダウンで選べる ASR(Nemotron / Gemini)は標準依存。
    "onnxruntime>=1.20",
    "google-genai>=1.16",
]

[project.optional-dependencies]
# PyTorch バックエンド extra は相互排他(どれか1つだけを指定する)。
# 本家 Irodori-TTS の pyproject をミラーしている。
#   uv sync --extra xpu    # Intel Arc (B570 等)
#   uv sync --extra cu128  # NVIDIA CUDA 12.8 (RTX 2080Ti 等)
#   uv sync --extra cpu    # CPU のみ / macOS
xpu = [
    "torch>=2.10.0,<2.11.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchao>=0.16.0,<0.17.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchaudio>=2.10.0,<2.11.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchcodec>=0.10.0,<0.11.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "triton-xpu==3.6.0; sys_platform == 'linux' or sys_platform == 'win32'",
]
cu128 = [
    "torch>=2.10.0,<2.11.0",
    "torchao>=0.16.0,<0.17.0",
    "torchaudio>=2.10.0,<2.11.0",
    "torchcodec>=0.10.0,<0.11.0",
]
cpu = [
    "torch>=2.10.0,<2.11.0",
    "torchao>=0.16.0,<0.17.0",
    "torchaudio>=2.10.0,<2.11.0",
    "torchcodec>=0.10.0,<0.11.0",
]
# 任意: ReazonSpeech (sherpa-onnx) ASR エンジン。asr.engine = "reazonspeech" で使う。
# sherpa-onnx の wheel メタデータは dynamic で、uv.lock に sherpa-onnx-core
# (libonnxruntime 同梱)が載らないことがあるため明示する。
reazonspeech = [
    "sherpa-onnx>=1.13.8,<1.14",
    "sherpa-onnx-core>=1.13.8,<1.14",
]
# 任意: CPU で音声感情認識。backend.json の pipeline.emotion_engine="emotion2vec" で使う。
emotion = ["funasr>=1.4.14"]

[tool.uv]
# sentencepiece 0.1.x(irodori-tts のピン "<0.2")は cp312 Windows wheel が存在せず、
# sdist ビルドが現行 CMake(3.5 未満互換削除)で必ず失敗するため 0.2.x へ上書きする。
override-dependencies = ["sentencepiece>=0.2.0,<0.3"]
# PyTorch バックエンド extra は同時に指定できない
conflicts = [
    [
        { extra = "xpu" },
        { extra = "cu128" },
        { extra = "cpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
triton-xpu = [
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sttts_server"]

[tool.hatch.metadata]
# irodori-tts @ git+... の direct reference を依存に持つために必要
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
