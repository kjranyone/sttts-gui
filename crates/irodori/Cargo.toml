[package]
name = "irodori"
description = "Pure-Rust inference for Irodori-TTS (burn: ndarray for reference, wgpu/Vulkan for GPU)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# GPU(wgpu: Vulkan / DX12 / Metal)。Intel Arc を含む。Level Zero / PyTorch に依存しない。
# 注意: burn/vulkan(SPIR-V コンパイラ)は Arc B570 + ドライバ 32.0.101.8860 で reduce 系(sum/mean/max/softmax/attention)が
# 誤った値を返すため使わない。WGSL 経路(burn/wgpu のみ)は全演算が CPU と一致する。
_gpu = ["burn/wgpu"]
# 既定の GPU 構成: 演算融合(fusion)と自動チューニング(autotune)は使わない。
# 有効にすると初回のカーネル探索・コンパイルが極端に長く(ModernBERT だけで 40 秒以上、コーデックは
# 層ごとに 10 秒以上)、使わない場合の初回は 1 秒未満(定常速度は同程度)。
gpu = ["_gpu"]
# 融合 + 自動チューニング(性能調査用。初回が非常に遅い)
gpu-tuned = ["_gpu", "burn/fusion", "burn/autotune"]

[dependencies]
# flex = 純 Rust の CPU バックエンド(参照・テスト用)
burn = { version = "0.22", default-features = false, features = ["std", "flex"] }
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
half = "2"
hound = "3"
claxon = "0.4"
memmap2 = "0.9"
unicode-normalization = "0.1"
realfft = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.9"
rand_distr = "0.5"
regex = "1"
sttts-hub = { path = "../hub" }
