[package]
name = "sttts-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sttts-gui"
path = "src/main.rs"

[dependencies]
sttts-protocol = { path = "../protocol" }
sttts-engine = { path = "../engine" }
gpui-kit = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-channel = { workspace = true }
base64 = { workspace = true }
rodio = "0.21"

[build-dependencies]
embed-resource = "3"

# API キーの暗号化保存(DPAPI)。gpui と同じ 0.62 系で依存を増やさない
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
