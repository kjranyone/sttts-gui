[package]
name = "sttts-i18n"
description = "UI language selection and inline translations (en / ja / zh) for sttts-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]

# OS の表示言語(GetUserDefaultUILanguage)。gpui と同じ 0.62 系で依存を増やさない
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Globalization"] }
