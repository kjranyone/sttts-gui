[package]
name = "sttts-engine"
description = "sttts-gui backend in Rust: mic -> VAD -> ASR -> chunking -> Irodori-TTS (in-process)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# 本番構成: TTS / Whisper は GPU(wgpu)で動かす。GPU を使えない環境(テスト)では無効にできる。
default = ["gpu", "live"]
gpu = ["irodori/gpu", "sttts-whisper?/gpu"]
# ライブ対話(マイク・VAD・ASR)。sttts-say(合成だけ)はこれを外してマイクのコードを持たない
live = ["dep:sttts-audio", "dep:sttts-whisper", "dep:sttts-gemini", "dep:sttts-nemotron"]

[dependencies]
sttts-protocol = { path = "../protocol" }
sttts-i18n = { path = "../i18n" }
irodori = { path = "../irodori" }
sttts-audio = { path = "../audio", optional = true }
sttts-whisper = { path = "../whisper", optional = true }
sttts-gemini = { path = "../gemini", optional = true }
sttts-nemotron = { path = "../nemotron", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
hound = "3"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
