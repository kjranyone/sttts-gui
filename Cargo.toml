[workspace]
resolver = "3"
members = ["crates/protocol", "crates/gui", "crates/irodori", "crates/audio", "crates/nemotron", "crates/whisper", "crates/gemini", "crates/engine", "crates/hub"]
# default-members は GUI(エンジン経由で burn / onnxruntime も含む)とプロトコルだけ。
# 個別クレートのテストは -p <crate> か --workspace で。
default-members = ["crates/protocol", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# gpui-pre 0.3.8 が std::hint::cold_path(Rust 1.95 で stable 化)を使用するため
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-channel = "2"
base64 = "0.22"

[profile.dev.package."*"]
# gpui-kit は debug ビルドが重いので依存のみ最適化する
opt-level = 2
