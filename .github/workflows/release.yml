name: Release

# `vX.Y.Z` のタグを push すると、ビルドして GitHub Releases に置く。
# 手順は docs/releasing.md を参照(Cargo.toml の version・Cargo.lock・CHANGELOG.md を先に更新する)。
#
# 配布物:
# - Windows x64: GUI+CLI の zip と CLI だけの zip
# - macOS (Apple Silicon) / Linux x64: CLI(sttts-say)だけの tar.gz。実機で未検証のため experimental と明記する
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against Cargo.toml and CHANGELOG.md
        id: meta
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version = "([^"]+)"') { throw 'workspace version not found in Cargo.toml' }
          if ($Matches[1] -ne $version) { throw "tag $tag does not match Cargo.toml version $($Matches[1])" }
          # CHANGELOG.md の "## [X.Y.Z]" 節をリリースノートにする
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version" }
          $notes = foreach ($l in $lines[$start..($lines.Count - 1)]) { if ($l -match '^## \[') { break }; $l }
          $notes = $notes | Where-Object { $_ -notmatch '^\[[^\]]+\]: ' }  # 末尾のリンク定義は除く
          $platforms = "**Downloads:** Windows x64 (``sttts-gui`` = GUI + CLI, ``sttts-say`` = CLI only). " +
            "macOS (Apple Silicon) and Linux x64 builds of ``sttts-say`` are **experimental**: they are built and unit-tested in CI, but not yet verified on real hardware."
          # SignPath Foundation の条件: ダウンロードページにも "Code signing policy" を載せる
          $policy = "[Code signing policy](https://github.com/kjranyone/sttts-gui#code-signing-policy) · [Privacy policy](https://github.com/kjranyone/sttts-gui/blob/main/PRIVACY.md)"
          (($notes -join "`n").Trim() + "`n`n---`n`n" + $platforms + "`n`n" + $policy) | Set-Content -Encoding utf8 release-notes.md
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($version -match '-') { "prerelease=--prerelease" >> $env:GITHUB_OUTPUT } else { "prerelease=" >> $env:GITHUB_OUTPUT }
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  windows:
    needs: meta
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p sttts-engine -p sttts-say -p sttts-i18n -p sttts-protocol -p sttts-hub
      # 別々にビルドする: 同じ cargo 呼び出しだと features が統合され、sttts-say にマイク・ASR が入ってしまう
      - name: Build sttts-gui
        run: cargo build --release --locked -p sttts-gui
      - name: Build sttts-say
        run: cargo build --release --locked -p sttts-say
      - name: Package
        shell: pwsh
        run: |
          $v = '${{ needs.meta.outputs.version }}'
          $dist = New-Item -ItemType Directory -Force dist
          $docs = @('LICENSE', 'PRIVACY.md', 'README.md', 'README.ja.md', 'README.zh-CN.md', 'CHANGELOG.md')
          function Pack([string]$name, [string[]]$exes) {
            $dir = Join-Path $env:RUNNER_TEMP $name
            New-Item -ItemType Directory -Force "$dir/skills" | Out-Null
            foreach ($e in $exes) { Copy-Item "target/release/$e" $dir }
            foreach ($d in $docs) { Copy-Item $d $dir }
            Copy-Item -Recurse skills/sttts-say "$dir/skills/"
            Compress-Archive -Path "$dir/*" -DestinationPath "$dist/$name.zip"
          }
          Pack "sttts-gui-v$v-$env:TARGET" @('sttts-gui.exe', 'sttts-say.exe')
          Pack "sttts-say-v$v-$env:TARGET" @('sttts-say.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*

  unix:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # 古めの glibc で作り、新しいディストリビューションでも動くようにする
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libasound2-dev
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # 配布する構成(live なし)でテストする。live は ONNX Runtime の配布バイナリが新しい glibc を要り、ubuntu-22.04 でリンクできない
      - name: Test
        run: |
          cargo test -p sttts-engine --no-default-features --features gpu
          cargo test -p sttts-say -p sttts-i18n -p sttts-protocol -p sttts-hub
      - name: Build sttts-say
        run: cargo build --release --locked -p sttts-say
      - name: Package
        run: |
          name="sttts-say-v${{ needs.meta.outputs.version }}-${{ matrix.target }}"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage/skills" dist
          cp target/release/sttts-say LICENSE PRIVACY.md README.md README.ja.md README.zh-CN.md CHANGELOG.md "$stage/"
          cp -R skills/sttts-say "$stage/skills/"
          tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: [meta, windows, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip *.tar.gz | sort -k2 > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist/* --repo '${{ github.repository }}' \
            --title '${{ github.ref_name }}' --notes-file release-notes.md --verify-tag ${{ needs.meta.outputs.prerelease }}
